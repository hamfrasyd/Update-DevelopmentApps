name: Validate PowerShell

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell syntax and local settings
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse PowerShell script and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('Update-DevelopmentApps.ps1', 'tests/SmokeTests.ps1')) {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  throw "$path has PowerShell syntax errors: $($errors[0].Message)"
              }
          }
      - name: Run configuration smoke tests
        shell: pwsh
        run: ./tests/SmokeTests.ps1
