name: Publish Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Versionsændring i forhold til seneste stabile release
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BUMP: ${{ inputs.bump }}
    steps:
      - name: Require the main branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Publish Release kan kun køres fra main. Du valgte '$env:GITHUB_REF'. Merge til main, og start workflowet derfra."
          }

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredPaths = @(
              'Update-DevelopmentApps.ps1',
              '.github/scripts/ReleaseVersion.ps1',
              'tests/SmokeTests.ps1',
              'tests/ReleaseVersionTests.ps1'
          )
          foreach ($relativePath in $requiredPaths) {
              $fullPath = Join-Path $PWD $relativePath
              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Påkrævet fil mangler: $relativePath"
              }
          }

      - name: Parse PowerShell script and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relativePath in @(
              'Update-DevelopmentApps.ps1',
              '.github/scripts/ReleaseVersion.ps1',
              'tests/SmokeTests.ps1',
              'tests/ReleaseVersionTests.ps1'
          )) {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $relativePath), [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  throw "$relativePath has PowerShell syntax errors: $($errors[0].Message)"
              }
          }

      - name: Run configuration smoke tests
        shell: pwsh
        run: ./tests/SmokeTests.ps1

      - name: Run release version tests
        shell: pwsh
        run: ./tests/ReleaseVersionTests.ps1

      - name: Build the versioned release asset
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          . ./.github/scripts/ReleaseVersion.ps1

          $bump = Resolve-ReleaseBump -Bump $env:RELEASE_BUMP
          $latestJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($latestJson)) {
              throw 'Kunne ikke læse seneste stabile GitHub Release. Næste version beregnes kun ud fra en publiceret release.'
          }
          $latest = $latestJson | ConvertFrom-Json
          if ($latest.draft -or $latest.prerelease) {
              throw "Release '$($latest.tag_name)' er ikke en stabil release."
          }

          $next = Get-NextReleaseVersion -CurrentVersion $latest.tag_name -Bump $bump
          $conflicts = @(Get-ConflictingReleaseTags -Repository $env:GITHUB_REPOSITORY -TagName $next.TagName)
          Assert-ReleaseTagIsAvailable -TagName $next.TagName -ExistingTags $conflicts

          $assetPath = Join-Path $PWD "dist\$($script:ScriptFileName)"
          Set-ReleaseScriptVersion -SourcePath (Join-Path $PWD $script:ScriptFileName) -DestinationPath $assetPath -Version $next.Version

          $outputEncoding = New-Object System.Text.UTF8Encoding -ArgumentList @($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "release_tag=$($next.TagName)`n", $outputEncoding)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "release_version=$($next.Version)`n", $outputEncoding)
          Write-Host "Næste release: $($next.TagName)"

      - name: Create the draft release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.build.outputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          . ./.github/scripts/ReleaseVersion.ps1

          $tagName = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($tagName) -or [string]::IsNullOrWhiteSpace($version)) {
              throw 'Det beregnede versionsnummer mangler. Releasen blev ikke oprettet.'
          }
          $expected = ConvertTo-ReleaseVersion -VersionText $tagName
          if ($expected.Version -ne $version -or $expected.TagName -ne $tagName) {
              throw "Tag '$tagName' matcher ikke version '$version'."
          }

          $conflicts = @(Get-ConflictingReleaseTags -Repository $env:GITHUB_REPOSITORY -TagName $tagName)
          Assert-ReleaseTagIsAvailable -TagName $tagName -ExistingTags $conflicts

          $assetPath = Join-Path $PWD "dist\$($script:ScriptFileName)"
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Releasefilen mangler: $assetPath"
          }

          gh release create $tagName `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $tagName `
              --generate-notes `
              --draft `
              "$assetPath"
          if ($LASTEXITCODE -ne 0) {
              throw "Kladden $tagName blev ikke oprettet."
          }

      - name: Verify the draft release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.build.outputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          . ./.github/scripts/ReleaseVersion.ps1

          $tagName = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $scriptFileName = $script:ScriptFileName
          $assetPath = Join-Path $PWD "dist\$scriptFileName"
          $localHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
          $expectedDigest = 'sha256:' + $localHash.ToLowerInvariant()

          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tagName" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw "Tag $tagName blev ikke oprettet. Kladden offentliggøres ikke."
          }
          $commitSha = [string]$tagRef.object.sha
          if ($tagRef.object.type -eq 'tag') {
              $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$commitSha" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) {
                  throw "Kunne ikke læse det annoterede tag $tagName. Kladden offentliggøres ikke."
              }
              $commitSha = [string]$annotated.object.sha
          }
          if ($commitSha -ne $env:GITHUB_SHA) {
              throw "Tag $tagName peger på $commitSha, ikke den godkendte main-commit $env:GITHUB_SHA. Kladden offentliggøres ikke."
          }

          $published = $null
          $asset = $null
          for ($attempt = 1; $attempt -le 6; $attempt++) {
              $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tagName" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) {
                  throw "Kunne ikke læse kladden $tagName. Den offentliggøres ikke."
              }
              if (-not $published.draft) {
                  throw "Release $tagName er ikke en kladde. Valideringen offentliggør den ikke."
              }
              $asset = @($published.assets | Where-Object { $_.name -eq $scriptFileName }) | Select-Object -First 1
              $digestMatches = $null -ne $asset -and [string]::Equals([string]$asset.digest, $expectedDigest, [StringComparison]::OrdinalIgnoreCase)
              if ($digestMatches) {
                  break
              }
              if ($attempt -lt 6) {
                  Start-Sleep -Seconds 5
              }
          }

          if ($published.tag_name -ne $tagName -or $published.name -ne $tagName) {
              throw "Release-navnet er ikke $tagName. Kladden offentliggøres ikke."
          }
          if (-not $published.draft -or $published.prerelease) {
              throw "Release $tagName er ikke en upubliceret kladde. Den offentliggøres ikke."
          }
          if ($null -eq $asset) {
              throw "Releaseasset '$scriptFileName' mangler på kladden $tagName. Den offentliggøres ikke."
          }
          if (-not [string]::Equals([string]$asset.digest, $expectedDigest, [StringComparison]::OrdinalIgnoreCase)) {
              throw "GitHub har ikke publiceret SHA-256-digestet for $scriptFileName. Kladden offentliggøres ikke."
          }

          $downloadDirectory = Join-Path $PWD 'dist-published'
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          gh release download $tagName --repo $env:GITHUB_REPOSITORY --pattern $scriptFileName --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) {
              throw "Kunne ikke downloade $scriptFileName fra kladden $tagName. Den offentliggøres ikke."
          }
          $downloadedPath = Join-Path $downloadDirectory $scriptFileName
          $downloadedHash = (Get-FileHash -LiteralPath $downloadedPath -Algorithm SHA256).Hash
          if (-not [string]::Equals($downloadedHash, $localHash, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Det uploadede asset matcher ikke den byggede releasefil. Kladden offentliggøres ikke.'
          }

          $downloaded = [System.IO.File]::ReadAllText($downloadedPath)
          $versionMatch = [regex]::Match(
              $downloaded,
              "(?m)^\s*\`$ScriptVersion\s*=\s*'(?<Version>\d+\.\d+\.\d+)'\s*$"
          )
          if (-not $versionMatch.Success -or $versionMatch.Groups['Version'].Value -ne $version) {
              throw "Det uploadede asset indeholder ikke `$ScriptVersion = '$version'. Kladden offentliggøres ikke."
          }

          Write-Host "Kladden $tagName er verificeret og er endnu ikke offentlig."

      - name: Publish the verified release
        if: success()
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.build.outputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $tagName = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tagName" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw "Kunne ikke læse kladden $tagName. Den blev ikke offentliggjort."
          }
          if (-not $release.draft -or $release.prerelease -or $release.tag_name -ne $tagName) {
              throw "Release $tagName er ikke en verificeret kladde. Den blev ikke offentliggjort."
          }

          gh release edit $tagName --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
              throw "Den verificerede kladde $tagName blev ikke offentliggjort."
          }

          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -ne $tagName -or $latest.draft -or $latest.name -ne $tagName) {
              throw "Seneste stabile release er '$($latest.tag_name)', ikke den offentliggjorte $tagName."
          }

          Write-Host "Publicerede $tagName ($version) som Latest."
